name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Import project
        run: ~/godot/godot --headless --import

      - name: Run tests
        run: |
          mkdir -p build
          ~/godot/godot --headless -s addons/gut/gut_cmdln.gd -gconfig=res://.gutconfig.json

      - name: Test report
        if: always()
        run: python3 tools/ci/test_summary.py build/test-results.xml >> "$GITHUB_STEP_SUMMARY"

      # The golden fights as a re-pin would write them (D122): when a change to fights is
      # meant and nobody has Godot to hand, copy the printed file into tests/golden/.
      - name: Golden fights re-pin preview
        if: always()
        run: |
          ~/godot/godot --headless --script res://tools/golden.gd -- --update
          if ! git diff --quiet tests/golden/golden_fights.json; then
            echo "GOLDEN FIGHTS CHANGED: tests/golden/golden_fights.json as re-pinned follows"
            echo "----- BEGIN golden_fights.json -----"
            cat tests/golden/golden_fights.json
            echo "----- END golden_fights.json -----"
          fi
          git checkout -- tests/golden/golden_fights.json

      - name: Balance snapshot
        if: always()
        run: |
          ~/godot/godot --headless --script res://tools/balance.gd -- --fights=40 --pairs=kicker:boxer,wrestler:kicker,wrestler:boxer,judoka:kicker,judoka:boxer,judoka:wrestler,bjj:kicker,bjj:boxer,bjj:wrestler,muay_thai:kicker,muay_thai:boxer,muay_thai:wrestler,check_red:check_blue
          cat build/balance/summary.txt
          {
            echo "## Balance snapshot (40 fights per pair, #18)"
            echo
            echo '```'
            cat build/balance/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Camp snapshot
        if: always()
        run: |
          mkdir -p build/camp
          ~/godot/godot --headless --script res://tools/camp.gd -- --fighter=wrestler --plan=wrestler --weeks=8 --age=19 --potential=80 --fights=100 | tee build/camp/wrestler.txt
          ~/godot/godot --headless --script res://tools/camp.gd -- --fighter=kicker --plan=all_out --weeks=8 --taper=0 | tee build/camp/all_out.txt
          {
            echo "## Camp snapshot (training camp, #54)"
            echo
            echo '```'
            cat build/camp/wrestler.txt
            echo
            cat build/camp/all_out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
