name: Playtest build

# The Windows build for the playtest (#20, D118, docs/playtests/README.md). Every push to
# main (and every PR, to prove it still exports) builds it; download it from the run's
# "Artifacts" list. A Linux export of the same project runs the self-check fight first,
# which proves data/ shipped inside the build (#35). It also exports the browser build (D240,
# threads off so GitHub Pages or itch.io can serve it as it is), and on main publishes it to
# GitHub Pages (D241, docs/04 §2.4) once Pages is switched on for the repo.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      # The full template download is 1.3 GB; only the Windows and Linux release templates are kept (about 180 MB).
      - name: Cache export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-web-${{ env.GODOT_VERSION }}

      - name: Download export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dir"
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -j -o templates.tpz templates/windows_release_x86_64.exe templates/linux_release.x86_64 templates/web_nothreads_release.zip templates/version.txt -d "$dir"
          rm templates.tpz

      - name: Import project
        run: ~/godot/godot --headless --import

      - name: Export
        run: |
          mkdir -p build/export/windows build/export/linux build/export/web
          ~/godot/godot --headless --export-release "Linux" build/export/linux/ChinCheck.x86_64
          ~/godot/godot --headless --export-release "Windows Desktop" build/export/windows/ChinCheck.exe
          test -s build/export/windows/ChinCheck.exe
          ~/godot/godot --headless --export-release "Web" build/export/web/index.html
          test -s build/export/web/index.wasm && test -s build/export/web/index.pck

      - name: Self-check the exported build
        run: build/export/linux/ChinCheck.x86_64 --headless -- --self-check

      - name: Add the testers' read-me
        run: cp docs/playtests/tester-readme.txt build/export/windows/README.txt

      # GitHub zips the folder: the download is ChinCheck-windows-<commit>.zip with ChinCheck.exe and README.txt inside.
      - name: Upload the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ChinCheck-windows-${{ github.sha }}
          path: build/export/windows/
          retention-days: 30

      # The browser build: index.html and its files. Unzip it and serve the folder (or upload the zip to itch.io as HTML).
      - name: Upload the web build
        uses: actions/upload-artifact@v4
        with:
          name: ChinCheck-web-${{ github.sha }}
          path: build/export/web/
          retention-days: 30

  # The browser build on GitHub Pages (D241): every push to main replaces the game at the Pages address. Until Pages is
  # switched on (Settings → Pages → Source: GitHub Actions) this job says so in the run summary and stays green.
  pages:
    needs: export
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Is Pages switched on?
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Say Pages is off
        if: steps.pages.outcome != 'success'
        run: |
          echo "### The web build isn't on GitHub Pages yet" >> "$GITHUB_STEP_SUMMARY"
          echo "Switch Pages on: Settings → Pages → Source: **GitHub Actions** (docs/04 §2.4), then re-run this workflow." >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch the web build
        if: steps.pages.outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ChinCheck-web-${{ github.sha }}
          path: web

      - name: Hand it to Pages
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Publish
        id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Say where it is
        if: steps.pages.outcome == 'success'
        run: echo "### Play it at ${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
